# Docker Compose for the Bun port of opencode2api.
#
#   docker compose up -d
#
# Edit ./config/config.json before the first start — server_keys, webui
# password and the upstream origin all come from it. The config file and
# any state it produces (config.json.bak, models.catalog.json) live in
# ./config and persist across restarts.
#
# IMPORTANT: set "listen": "0.0.0.0:8080" and "webui.listen":
# "0.0.0.0:8081" in config.json so the container accepts traffic from
# the published docker ports.

services:
  opencode2api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode2api
    restart: unless-stopped
    ports:
      - "8080:8080"   # API (from config.json listen)
      - "8081:8081"   # WebUI (from config.json webui.listen)
    volumes:
      - ./config:/config:rw
    environment:
      - CONFIG=/config/config.json
      - WEBUI_DIR=/app/webui
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
